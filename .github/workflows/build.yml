# On every push: run the engine tests, build a signed APK, check it asks for nothing but SMS,
# then put it on the "latest" release so the download link never changes:
# https://github.com/shraddheyadesigns/autopay-hunter/releases/download/latest/AutoNope.apk
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check the signing secrets are set
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Signing secrets missing. Add KEYSTORE_B64, KEYSTORE_PASSWORD and KEY_ALIAS in repo Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Engine tests
        run: |
          curl -sSL -o "$RUNNER_TEMP/kotlinc.zip" https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q "$RUNNER_TEMP/kotlinc.zip" -d "$RUNNER_TEMP"
          PATH="$RUNNER_TEMP/kotlinc/bin:$PATH" sh ./run-tests.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/autonope.p12"
          export AUTONOPE_KEYSTORE="$RUNNER_TEMP/autonope.p12"
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          rm -f "$RUNNER_TEMP/autonope.p12"
          cp app/build/outputs/apk/release/app-release.apk AutoNope.apk

      - name: Check the APK asks for SMS and nothing else
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump permissions AutoNope.apk | tee perms.txt
          grep -q "android.permission.READ_SMS" perms.txt || { echo "::error::READ_SMS missing from the APK"; exit 1; }
          # androidx always adds one internal, app-only permission; that's the only other one allowed.
          EXTRA=$(grep "uses-permission" perms.txt | grep -v "android.permission.READ_SMS" | grep -v "DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION" || true)
          if [ -n "$EXTRA" ]; then echo "::error::Unexpected permission in the APK: $EXTRA"; exit 1; fi
          echo "Permissions OK: SMS only, no internet."
          ls -lh AutoNope.apk

      - name: Keep a copy on the run page
        uses: actions/upload-artifact@v4
        with:
          name: AutoNope-apk
          path: AutoNope.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTE="Built from ${GITHUB_SHA::7} on $(date -u '+%d %b %Y, %H:%M UTC'). Download AutoNope.apk on your phone and tap to install."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest AutoNope.apk --clobber
            gh release edit latest --notes "$NOTE"
          else
            gh release create latest AutoNope.apk --title "Latest build" --notes "$NOTE" --prerelease
          fi
